# Slack App を作るときに「From a manifest」で貼り付ける設定
display_information:
  name: Reply Driver
  description: 回答への返信で AI を再駆動するアシスタント
features:
  bot_user:
    display_name: Reply Driver
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - chat:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
